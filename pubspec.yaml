name: flutter_rar
description: Native UnRAR for Flutter. List and extract password-protected RAR4 and RAR5, and return the path of every extracted file.
version: 0.2.0
repository: https://github.com/itsdevzam/flutter_rar
topics:
  - rar
  - archive
  - compression

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  koni_archive: ^0.9.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: FlutterRarPlugin
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: FlutterRarWeb
        fileName: flutter_rar_web_plugin.dart
